apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
## Append samples of your project ##
resources:
  # Prerequisites first — pre-existing RBAC resources the edge-case BDs reference
  - edge-case-prerequisites.yaml
  # Plain RoleDefinition/BindDefinition samples are platform-admin/trusted-admin
  # authored examples. Use the restricted samples below for delegated workflows.
  - authorization_v1alpha1_roledefinition.yaml
  - authorization_v1alpha1_binddefinition.yaml
  - authorization_v1alpha1_webhookauthorizer.yaml
  # Restricted CRDs — policy must be created before restricted definitions
  - authorization_v1alpha1_rbacpolicy.yaml
  - authorization_v1alpha1_restrictedbinddefinition.yaml
  - authorization_v1alpha1_restrictedroledefinition.yaml
  # Constrained impersonation (KEP-5284) samples. Valid on every cluster: on an
  # apiserver without the ConstrainedImpersonation feature gate the generated
  # grants are accepted but inert, which the operator surfaces via the
  # ConstrainedImpersonationEffective condition.
  - authorization_v1alpha1_constrained_impersonation.yaml
  # NOTE: Broken sample cases live under config/samples/broken/ and are applied
  # explicitly in CI output-delta to surface expected failure behavior.
# +kubebuilder:scaffold:manifestskustomizesamples
